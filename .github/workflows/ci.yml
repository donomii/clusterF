name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Go env
        run: |
          go env

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Build (CGO disabled for headless build)
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...

      - name: Test (Full)
        env:
          CGO_ENABLED: 0
          CLUSTER_DISCOVERY_MODE: local
          CLUSTERF_SANDBOX: 0
        run: |
          go test ./...
          go -C frontend test ./...
          go -C syncmap test ./...

      - name: Test concurrent storage and coordination
        env:
          CGO_ENABLED: 1
          CLUSTER_DISCOVERY_MODE: local
          CLUSTERF_SANDBOX: 0
        run: |
          go test -race ./clusterstate ./discovery ./partitionmanager ./storagecrypto ./threadmanager ./filesync ./filesystem ./webdav
          go test -race transcoder.go transcoder_test.go

      - name: Test cluster regressions with race detector (macOS WebKit)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: 1
          CLUSTER_DISCOVERY_MODE: local
          CLUSTERF_SANDBOX: 0
        run: |
          go test -race -run 'TestReview|TestEncryptedStartup|TestStorageEncryption|TestTranscode|TestConcurrentTranscode|TestOldTranscodeCache' .

      # Optional benchmarks (disabled by default). Enable with workflow_dispatch input or env in future.
      # - name: Benchmarks
      #   if: ${{ false }}
      #   run: |
      #     go test -bench=. -run=^$ ./...
